services:
  - type: web
    name: adpilot
    runtime: node
    plan: free
    # Default region is oregon; Singapore is far closer to the intended audience.
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    # Demo state lives in process memory, so keep this at a single instance.
    numInstances: 1
    envVars:
      # Next 16 requires Node 20.9+, and parts of the toolchain want 20.19+.
      - key: NODE_VERSION
        value: 22.11.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # ADS_PROVIDER is intentionally unset: the demo provider is the default,
      # and any other value fails loudly rather than faking a live connection.
      # sync: false means Render prompts for these at Blueprint sync time and
      # stores them only on the service; the values never live in this file
      # or in git.
      - key: DEMO_LOGIN_EMAIL
        sync: false
      - key: DEMO_LOGIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
